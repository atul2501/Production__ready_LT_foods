services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LOG_FILE: /var/log/app/app.log
    depends_on:
      - postgres
      - redis
    volumes:
      - pdf_storage:/data/pdfs
      - app_logs:/var/log/app
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      LOG_FILE: /var/log/app/app.log
      # Match your Ollama Cloud plan's real concurrent-request limit (Pro ~3, Max ~10) -
      # see Dockerfile.worker and .env.example for why.
      WORKER_CONCURRENCY: 3
    depends_on:
      - postgres
      - redis
      - ollama
    volumes:
      - pdf_storage:/data/pdfs
      - app_logs:/var/log/app
    restart: unless-stopped
    # Additional throughput lever once concurrency alone isn't enough:
    # docker compose up -d --scale worker=4

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoices
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment for GPU passthrough (requires nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pdf_storage:
  pg_data:
  ollama_data:
  app_logs:
